services:
  web:
    build: .
    command:
      - sh
      - -c
      - >-
        python manage.py migrate &&
        python manage.py createcachetable &&
        exec gunicorn pos_system.wsgi:application
        --bind 0.0.0.0:8000
        --workers 2 --worker-class gthread --threads 4
        --timeout 120 --graceful-timeout 120
        --access-logfile -
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      DURIELBIZ_PRODUCTION: "1"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
  subscription-reminders:
    build: .
    command: python manage.py run_subscription_reminder_scheduler --hour 8
    env_file: .env
    environment:
      DURIELBIZ_PRODUCTION: "1"
    depends_on:
      - web
    restart: unless-stopped
